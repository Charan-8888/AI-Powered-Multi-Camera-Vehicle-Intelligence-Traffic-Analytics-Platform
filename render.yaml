services:
  - type: web
    name: anpr-mvp-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT
    healthCheckPath: /api/dashboard/stats/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anpr-mvp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: anpr-mvp-db
    region: singapore
    plan: free
