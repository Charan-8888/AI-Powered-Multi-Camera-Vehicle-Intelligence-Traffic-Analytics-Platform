services:
  - type: web
    name: anpr-mvp-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT
    healthCheckPath: /api/dashboard/stats/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anpr-mvp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"

  - type: web
    name: anpr-mvp-dashboard
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://anpr-mvp-api.onrender.com/api

databases:
  - name: anpr-mvp-db
    region: singapore
    plan: free
